# QREV Platform — run everything with: docker compose up --build
#
# Services:
#   db     → PostgreSQL 16 (shared by frontend + backend)
#   server → Python FastAPI backend (agents, providers, orchestration)
#   web    → Next.js 14 frontend
#
# First time setup:
#   1. cp .env.example .env
#   2. Fill in CREDENTIALS_ENCRYPTION_KEY (see .env.example)
#   3. docker compose up --build

services:
  # ── PostgreSQL ───────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qrev
      POSTGRES_PASSWORD: qrev
      POSTGRES_DB: qrev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Python Backend (FastAPI) ─────────
  server:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://qrev:qrev@db:5432/qrev
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
      FRONTEND_URL: http://localhost:3000
      DEBUG: "true"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

  # ── Next.js Frontend ─────────────────
  web:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://qrev:qrev@db:5432/qrev
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Client-side calls go to localhost:8000 (browser → host → server container)
      NEXT_PUBLIC_API_URL: http://localhost:8000/api

volumes:
  pgdata:
