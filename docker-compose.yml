# QRev Lite - Docker Compose
# Usage: docker-compose up --build

services:
  db:
    image: postgres:16-alpine
    container_name: qrev-lite-db
    environment:
      POSTGRES_DB: qrev
      POSTGRES_USER: qrev
      POSTGRES_PASSWORD: qrev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrev"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: qrev-lite-app
    environment:
      DATABASE_URL: postgresql://qrev:qrev@db:5432/qrev
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-secret-here}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
